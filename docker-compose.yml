# ==============================================================================
# REUSABLE EXTENSION BLOCKS (Top-level declaration - NOT under services)
# ==============================================================================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment:
    # ================= Airflow Core =================
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    
    # ================= Airflow 3 Auth =================
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__AUTH_JWT_SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    
    # ================= API Server & Auth Manager =================
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    
    # ================= Database =================
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@airflow-postgres/${AIRFLOW_DB}

    # ================= DAG Processor =================
    AIRFLOW__DAG_PROCESSOR__ENABLED: "true"
    AIRFLOW__DAG_PROCESSOR__DAG_DIRECTORY: /opt/airflow/dags
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: 2

    # ================= System & Modules =================
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    PYTHONPATH: /opt/airflow:/opt/airflow/dags:/opt/airflow/plugins
    DBT_PROFILES_DIR: /opt/airflow/dbt

    # ================= Infrastructure Mapping =================
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_ENDPOINT: http://minio:9000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./spark/jobs:/home/jobs
    - ./spark/jars:/opt/spark/jars
    - ./dbt/project:/opt/airflow/dbt  
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - crypto_stream_platform

# ==============================================================================
# MAIN SERVICES
# ==============================================================================
networks:
  crypto_stream_platform:
    name: crypto_stream_platform
    driver: bridge

services:
  # ========== INFRASTRUCTURE ==========

  # ---------- Kafka (KRaft) ----------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    networks:
      - crypto_stream_platform
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Kafka UI ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - crypto_stream_platform
    ports:
      - "18090:8080"
    depends_on:
      kafka:
        condition: service_healthy
      
    environment:
      KAFKA_CLUSTERS_0_NAME: crypto_stream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

# ---------- MinIO ----------
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - crypto_stream_platform
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  mc:
    image: minio/mc:latest
    container_name: mc
    networks:
      - crypto_stream_platform
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb -p local/warehouse;
      exit 0;
      "

  iceberg-rest-init:
    image: busybox
    container_name: iceberg-rest-init
    networks:
      - crypto_stream_platform
    volumes:
      - iceberg-catalog-data:/var/lib/iceberg-catalog
    command: sh -c "mkdir -p /var/lib/iceberg-catalog && chmod -R 777 /var/lib/iceberg-catalog"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    networks:
      - crypto_stream_platform
    depends_on:
      - minio
      - mc
      - iceberg-rest-init
    ports:
      - "8181:8181"
    environment:
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg-catalog/catalog.db    
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog-data:/var/lib/iceberg-catalog   

 

  spark-iceberg:
    image: spark-iceberg-preloaded:latest
    container_name: spark-iceberg
    networks:
      - crypto_stream_platform
    depends_on:
      - iceberg-rest
      - kafka
      - minio
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI
      - "10000:10000" # Hive Thrift Server
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    volumes:
      - ./spark/jobs:/home/jobs
      - spark-checkpoints:/home/iceberg/checkpoints
    command: ["/home/entrypoint.sh"]

# ---------- dbt ----------
  dbt:
    build: ./dbt
    container_name: dbt
    networks:
      - crypto_stream_platform
    depends_on:
      - spark-iceberg
    volumes:
      - ./dbt/project:/usr/app
    working_dir: /usr/app
    tty: true
    entrypoint: ["sleep", "infinity"]


  # ========== ORCHESTRATION (Airflow 3 Setup) ==========

  # ---------- Airflow Postgres ----------
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_USER}"]
      interval: 10s
      retries: 5
    networks:
      - crypto_stream_platform

  # ---------- Airflow Init ----------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        export PATH="/home/airflow/.local/bin:/usr/local/bin:$$PATH"
        
        # Airflow 3 database schema setup
        airflow db migrate        
        
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin123}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true

        airflow connections add 'minio_s3' \
          --conn-type 'aws' \
          --conn-extra "{\"aws_access_key_id\": \"${MINIO_ROOT_USER}\", \"aws_secret_access_key\": \"${MINIO_ROOT_PASSWORD}\", \"endpoint_url\": \"http://minio:9000\", \"region_name\": \"${AWS_REGION:-us-east-1}\"}" \
          || true
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # ---------- Airflow API Server (Airflow 3 Component) ----------
  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    command: api-server
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ---------- Airflow UI / Webserver ----------
  airflow-ui:
    <<: *airflow-common
    container_name: airflow-ui
    command: webserver
    ports:
      - "8086:8080"
    depends_on:
      airflow-api-server:
        condition: service_healthy
    restart: always

  # ---------- Airflow Scheduler ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    user: "0:0"
    depends_on:
      airflow-api-server:
        condition: service_healthy
    restart: always

  # ---------- Airflow DAG Processor ----------
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-api-server:
        condition: service_healthy
    restart: always

  # ---------- Airflow Triggerer ----------
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow-api-server:
        condition: service_healthy
    restart: always

volumes:
  kafka-data:       
  minio-data:
  spark-checkpoints:
  airflow-postgres-data:
  iceberg-catalog-data: